<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de tu pedido | TRENDORA</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">TREND<span>ORA.</span></a></header><main style="max-width:650px;margin:90px auto;padding:25px;text-align:center"><span class="eyebrow">TRENDORA / PEDIDOS</span><h1 id="title" style="font:800 36px Manrope">Estamos revisando tu pago</h1><p id="message" class="muted">La confirmación definitiva llegará cuando Mercado Pago notifique el resultado a nuestra tienda.</p><p class="muted">Número de pedido: <b id="order"></b></p><a class="btn" href="index.html">Volver a la tienda</a></main><script>const q=new URLSearchParams(location.search),s=q.get("estado");document.getElementById("order").textContent=q.get("pedido")||"No disponible";if(s==="success"){document.getElementById("title").textContent="¡Gracias por tu compra!";document.getElementById("message").textContent="Mercado Pago indicó que el flujo terminó correctamente. La confirmación final depende de la notificación segura del pago."}else if(s==="pending"){document.getElementById("title").textContent="Tu pago está pendiente";document.getElementById("message").textContent="Tu pedido quedará pendiente hasta que Mercado Pago confirme el pago."}else{document.getElementById("title").textContent="No se completó el pago";document.getElementById("message").textContent="Puedes regresar a la tienda e intentarlo nuevamente."}</script></body></html>
